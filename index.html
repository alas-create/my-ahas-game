<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden; /* Prevent scrolling when using arrow keys */
        }
        
        h1 {
            margin: 0 0 10px 0;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        canvas {
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            margin-top: 15px;
            color: #bdc3c7;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <!-- This is the game board -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">Press any arrow key to start moving!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game settings
        const gridSize = 20; // Size of one grid square
        const tileCount = canvas.width / gridSize; // How many squares fit on the board

        // Initial snake properties
        let snake = [
            { x: 10, y: 10 } // Snake starts in the middle
        ];
        let food = { x: 5, y: 5 };
        
        // Speed in X and Y directions
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let gameStarted = false;

        // Listen for keyboard presses
        document.addEventListener("keydown", changeDirection);

        // Draw the initial board
        clearCanvas();
        drawFood();
        drawSnake();

        // The main game loop that repeats over and over
        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Your final score is: " + score + "\nClick OK to play again.");
                document.location.reload(); // Reload the page to restart
                return;
            }

            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 100); // 100 milliseconds determines the speed of the snake
        }

        // Wipe the canvas clean before drawing the next frame
        function clearCanvas() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draw the snake on the canvas
        function drawSnake() {
            snake.forEach((part, index) => {
                // The head is a lighter green than the body
                ctx.fillStyle = index === 0 ? "#2ecc71" : "#27ae60"; 
                ctx.strokeStyle = "#145a32"; // Dark border
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        // Draw the food
        function drawFood() {
            ctx.fillStyle = "#e74c3c"; // Red food
            ctx.strokeStyle = "#922b21";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // Calculate the snake's new position
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Add new head

            // Check if the snake ate the food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood(); // Make new food
            } else {
                snake.pop(); // Remove tail if it didn't eat
            }
        }

        // Place food in a random spot
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // Make sure food doesn't spawn directly on top of the snake
            snake.forEach(function has_snake_eaten_food(part) {
                const has_eaten = part.x === food.x && part.y === food.y;
                if (has_eaten) generateFood();
            });
        }

        // Handle arrow keys
        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            
            // Prevent scrolling the window with arrows
            if([LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed)) {
                event.preventDefault();
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Start game on first key press
            if (!gameStarted && [LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed)) {
                gameStarted = true;
                main();
            }

            // Change direction (and prevent reversing into itself)
            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        // Check for collisions
        function hasGameEnded() {
            // Did snake crash into itself?
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            
            // Did snake hit the walls?
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }
    </script>
</body>
</html>
