<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
        }
        
        h1 {
            margin: 0 0 10px 0;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        canvas {
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            margin-top: 15px;
            color: #bdc3c7;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">Press any arrow key to start moving!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; 

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameLoop;
        let gameStarted = false;

        document.addEventListener("keydown", changeDirection);

        clearCanvas();
        drawWatermark(); // Draw watermark initially
        drawFood();
        drawSnake();

        function main() {
            if (hasGameEnded()) {
                alert("Game Over! Your final score is: " + score + "\nClick OK to play again.");
                document.location.reload(); 
                return;
            }

            setTimeout(function onTick() {
                clearCanvas();
                drawWatermark(); // Redraw watermark every frame so it stays in the background
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 100); 
        }

        function clearCanvas() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- NEW WATERMARK FUNCTION ---
        function drawWatermark() {
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)"; // Very faint white (15% opacity)
            ctx.font = "bold 36px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            // Place exactly in the center of the 400x400 canvas
            ctx.fillText("DAELAN REVV", canvas.width / 2, canvas.height / 2);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#2ecc71" : "#27ae60"; 
                ctx.strokeStyle = "#145a32"; 
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        function drawFood() {
            ctx.fillStyle = "#e74c3c"; 
            ctx.strokeStyle = "#922b21";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); 

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                generateFood(); 
            } else {
                snake.pop(); 
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            snake.forEach(function has_snake_eaten_food(part) {
                const has_eaten = part.x === food.x && part.y === food.y;
                if (has_eaten) generateFood();
            });
        }

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            const keyPressed = event.keyCode;
            
            if([LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed)) {
                event.preventDefault();
            }

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (!gameStarted && [LEFT_KEY, RIGHT_KEY, UP_KEY, DOWN_KEY].includes(keyPressed)) {
                gameStarted = true;
                main();
            }

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
            }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }
    </script>
</body>
</html>
